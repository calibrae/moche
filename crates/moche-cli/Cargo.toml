[package]
name = "moche-cli"
description = "Daily-driver mosh-compatible client built on moche-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "moche"
path = "src/main.rs"

[features]
# TODO(screen): enable once moche_core::screen::Screen lands; swaps the
# passthrough display for the real framebuffer-backed one (see display.rs).
screen = []

[dependencies]
moche-core.workspace = true
rustix = { version = "1.1", features = ["termios", "event", "stdio"] }
signal-hook = "0.3"
