# moche test lab VM (moche-b). No host mounts, no containerd, vzNAT shared network.
vmType: vz
cpus: 2
memory: 2GiB
disk: 12GiB
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64
mounts: []
containerd:
  system: false
  user: false
# vzNAT: host<->VM reachable (lima0), but VMs cannot reach each other on it (L2 isolated).
# user-v2: VM<->VM reachable (eth0), not reachable from the host directly.
networks:
  - vzNAT: true
  - lima: user-v2
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y mosh tcpdump iproute2 iptables nftables vim htop tmux curl ca-certificates openssh-server git build-essential pkg-config
