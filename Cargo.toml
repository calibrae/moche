[workspace]
resolver = "2"
members = ["crates/moche-core", "crates/moche-ffi", "crates/moche-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["moche contributors"]
repository = "https://github.com/calibrae/moche"
publish = false

[workspace.dependencies]
moche-core = { path = "crates/moche-core" }
base64 = "0.23"
aes = { version = "0.9", features = ["zeroize"] }
ocb3 = "0.2"
zeroize = "1"
getrandom = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Small and self-contained: moche ships as an iOS static lib and a Mac CLI.
# No panic = "abort": moche-ffi catches panics at the C boundary (catch_unwind).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# iOS static libs (tools/ios/build-xcframework.sh). No LTO: fat/thin LTO leaves LLVM
# bitcode around, which App Store Connect can reject and Xcode's LLVM cannot read.
[profile.ios]
inherits = "release"
lto = "off"
codegen-units = 1
debug = 0
strip = "debuginfo"
