[graph]
all-features = true

[licenses]
# Unicode-3.0: pulled in by unicode-ident (via proc-macro stacks) and
# permissive; it is the licence of the Unicode data files.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
